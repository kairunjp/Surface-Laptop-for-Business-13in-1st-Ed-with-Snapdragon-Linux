[options]
Architecture = aarch64
HoldPkg = pacman glibc
ParallelDownloads = 5
DisableDownloadTimeout
# The Surface kernel does not expose Landlock; pacman otherwise aborts while
# switching to its alpm sandbox user during the installer's database sync.
DisableSandbox
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Server = %ARCHLINUX_MIRROR%/core

[extra]
Server = %ARCHLINUX_MIRROR%/extra

[alarm]
Server = %ARCHLINUX_MIRROR%/alarm
