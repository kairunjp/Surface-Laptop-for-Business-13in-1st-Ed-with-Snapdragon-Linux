# Surface Laptop 13 (X1P42100) audio profile.
#
# The generic X1E profile uses the wrong DMIC inputs on this board.  Keep the
# standard WSA codec sequences, then apply the machine-specific AudioReach
# gain and stereo-DMIC routing explicitly. The WCD9385 headset path remains
# an opt-in experiment until its DAI links can be enabled without preventing
# the base WSA/VA card from probing.

SectionVerb {
	EnableSequence [
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia4 Mixer VA_CODEC_DMA_TX_0' 1"
		cset "name='stream1.vol_ctrl1 MultiMedia2 Playback Volu' 8192"
	]

	Include.wsae.File "/codecs/wsa884x/two-speakers/DefaultEnableSeq.conf"
	Include.wsm1e.File "/codecs/qcom-lpass/wsa-macro/Wsa1SpeakerEnableSeq.conf"

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Built-in speakers"
	Include.wsmspk1e.File "/codecs/qcom-lpass/wsa-macro/Wsa1SpeakerEnableSeq.conf"
	Include.wsmspk1d.File "/codecs/qcom-lpass/wsa-macro/Wsa1SpeakerDisableSeq.conf"
	Include.wsaspk.File "/codecs/wsa884x/two-speakers/SpeakerSeq.conf"

	# Keep the speaker frontend at AudioReach's firmware-default unity gain.
	EnableSequence [
		cset "name='stream1.vol_ctrl1 MultiMedia2 Playback Volu' 8192"
		cset "name='SpkrLeft PA Volume' 6"
		cset "name='SpkrRight PA Volume' 6"
		cset "name='WSA WSA_RX0 Digital Volume' 81"
		cset "name='WSA WSA_RX1 Digital Volume' 81"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "Speakers"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphones"

	# Both internal microphones are carried by the stereo DMIC2 input on this
	# board.  Do not include the generic DMIC0/DMIC1 sequences: those inputs are
	# silent on this machine.
	EnableSequence [
		cset "name='MultiMedia4 Mixer VA_CODEC_DMA_TX_0' 1"
		cset "name='VA DEC0 MUX' VA_DMIC"
		cset "name='VA DMIC MUX0' DMIC2"
		cset "name='VA_AIF1_CAP Mixer DEC0' 1"
		cset "name='VA_DEC0 Volume' 84"
		cset "name='VA DEC1 MUX' VA_DMIC"
		cset "name='VA DMIC MUX1' DMIC2"
		cset "name='VA_AIF1_CAP Mixer DEC1' 1"
		cset "name='VA_DEC1 Volume' 84"
	]

	Value {
		CaptureChannels 2
		CapturePriority 100
		CapturePCM "hw:${CardId},3"
	}
}
