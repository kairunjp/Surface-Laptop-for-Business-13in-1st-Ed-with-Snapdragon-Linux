# Surface Laptop 13 (X1P42100) audio profile.
#
# The generic X1E profile leaves the AudioReach stream gain at a low value and
# initializes the stereo DMA mixers through a single-value cset.  On this
# machine that results in a very quiet speaker and a capture path with only
# one DMA channel enabled.  Keep the standard codec sequences, then restore
# the machine-specific controls explicitly.

SectionVerb {
	Include.wsae.File "/codecs/wsa884x/two-speakers/DefaultEnableSeq.conf"
	Include.wsm1e.File "/codecs/qcom-lpass/wsa-macro/Wsa1SpeakerEnableSeq.conf"

	EnableSequence [
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 1"
		cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 65535"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Built-in speakers"
	Include.wsmspk1e.File "/codecs/qcom-lpass/wsa-macro/Wsa1SpeakerEnableSeq.conf"
	Include.wsmspk1d.File "/codecs/qcom-lpass/wsa-macro/Wsa1SpeakerDisableSeq.conf"
	Include.wsaspk.File "/codecs/wsa884x/two-speakers/SpeakerSeq.conf"

	# Put the stream gain and the WSA power path after the generic sequences.
	EnableSequence [
		cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 65535"
		cset "name='SpkrLeft PA Volume' 6"
		cset "name='SpkrRight PA Volume' 6"
		cset "name='WSA WSA_RX0 Digital Volume' 81"
		cset "name='WSA WSA_RX1 Digital Volume' 81"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "Speakers"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphones"
	# DMIC0/1 are the two internal microphone channels on this board.  Do not
	# include the generic DMIC enable sequences: they set the VA gain to 100
	# and use a single-value DMA cset, both of which are wrong for this card.
	EnableSequence [
		cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 1"
		cset "name='VA DEC0 MUX' VA_DMIC"
		cset "name='VA DMIC MUX0' DMIC0"
		cset "name='VA_AIF1_CAP Mixer DEC0' 1"
		cset "name='VA_DEC0 Volume' 84"
		cset "name='VA DEC1 MUX' VA_DMIC"
		cset "name='VA DMIC MUX1' DMIC1"
		cset "name='VA_AIF1_CAP Mixer DEC1' 1"
		cset "name='VA_DEC1 Volume' 84"
	]

	Value {
		CaptureChannels 2
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
	}
}
