# WSA/VA baseline only; internal microphone wiring remains unverified.
Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/x1e80100/SurfaceLaptop13-HiFi.conf"
	Comment "HiFi quality Music."
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wsa-init.File "/codecs/wsa884x/two-speakers/init.conf"
# The DT gives this macro sound-name-prefix="WSA". The generic init.conf
# uses unprefixed WSA_RX* / WSA_COMP* names, which do not address our controls.
BootSequence [
	cset "name='WSA WSA_RX0 Digital Volume' 81"
	cset "name='WSA WSA_RX1 Digital Volume' 81"
	cset "name='WSA WSA_COMP1 Switch' 0"
	cset "name='WSA WSA_COMP2 Switch' 0"
]
