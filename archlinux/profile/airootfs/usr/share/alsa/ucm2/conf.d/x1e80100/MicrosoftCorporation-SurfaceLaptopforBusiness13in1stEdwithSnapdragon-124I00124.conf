# The Surface Laptop for Business 13 uses the X1E80100 codec wiring, but its
# measured mixer needs a machine-specific profile for the stream gain and
# DMIC/WSA channel setup.
Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/x1e80100/SurfaceLaptop13-HiFi.conf"
	Comment "HiFi quality Music."
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wsa-init.File "/codecs/wsa884x/two-speakers/init.conf"
Include.wsam-init.File "/codecs/qcom-lpass/wsa-macro/init.conf"
