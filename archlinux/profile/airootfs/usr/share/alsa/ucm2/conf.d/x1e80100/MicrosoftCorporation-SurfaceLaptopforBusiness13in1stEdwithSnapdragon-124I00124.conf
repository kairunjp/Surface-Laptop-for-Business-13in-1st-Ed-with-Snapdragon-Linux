# The Surface Laptop for Business 13 uses the same X1E80100 codec wiring as
# the Surface Pro 12in UCM profile. Map this machine's exact ALSA card name to
# that profile so WirePlumber can apply the speaker and microphone routes.
Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/x1e80100/Surface12in-HiFi.conf"
	Comment "HiFi quality Music."
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wsa-init.File "/codecs/wsa884x/two-speakers/init.conf"
Include.wsam-init.File "/codecs/qcom-lpass/wsa-macro/init.conf"
