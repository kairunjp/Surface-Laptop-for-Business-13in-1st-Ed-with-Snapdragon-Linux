# The upstream archiso GRUB binary embeds the loader and then imports this
# file from the ISO filesystem.  The DTB command is provided by GRUB's fdt
# module and must follow linux/initrd, because it replaces the firmware FDT
# just before the kernel is started.
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod udf
insmod fdt

set default=surface-current
set timeout=8
timeout_style=menu

menuentry "Surface Laptop 13 (safe, DSP disabled)" --id surface-current {
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=tty0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    devicetree /boot/grub/surface-laptop-13-archlinux.dtb
}

menuentry "Surface Laptop 13 (Bluetooth enabled)" --id surface-bluetooth {
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=tty0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    devicetree /boot/grub/surface-laptop-13-archlinux-bluetooth.dtb
}

menuentry "System shutdown" --class shutdown --class poweroff {
    echo "System shutting down..."
    halt
}

menuentry "System restart" --class reboot --class restart {
    echo "System restarting..."
    reboot
}
