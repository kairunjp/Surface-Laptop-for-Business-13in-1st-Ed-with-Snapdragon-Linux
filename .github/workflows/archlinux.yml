name: Build Arch Linux ARM64 ISO

on:
  push:
    branches:
      - archlinux
    paths:
      - .github/workflows/archlinux.yml
      - archlinux/**
      - build.sh
      - device-tree/**
      - kernel/**
      - drivers/firmware-manifest.json
      - build/archlinux-reference/**
  workflow_dispatch:
    inputs:
      wifi_firmware_url:
        description: 'HTTPS URL of the surface-pve boot Wi-Fi reference tar.gz (or use repository variable WCN7850_FIRMWARE_URL)'
        required: false
        type: string
      gpu_firmware_url:
        description: 'Optional HTTPS URL of a validated Surface Laptop 13 Adreno GPU firmware tar.gz'
        required: false
        type: string
permissions:
  contents: read

concurrency:
  group: archlinux-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Surface Laptop 13 Arch Linux ARM64 ISO
    # archiso does not support cross-architecture image creation.  This is
    # the native ARM64 runner available to public repositories.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      WCN7850_FIRMWARE_URL: ${{ inputs.wifi_firmware_url || vars.WCN7850_FIRMWARE_URL }}
      # Use the checked-in, model-specific archive for push builds. Only an
      # explicit manual input may replace it, avoiding stale repository URLs.
      GPU_FIRMWARE_URL: ${{ inputs.gpu_firmware_url }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl \
            device-tree-compiler file flex gcc git kmod libarchive-tools \
            libelf-dev libssl-dev openssl patch python3 ripgrep xorriso xz-utils

      - name: Build ISO
        run: |
          sudo env \
            WCN7850_FIRMWARE_URL="$WCN7850_FIRMWARE_URL" \
            GPU_FIRMWARE_URL="$GPU_FIRMWARE_URL" \
            DSP_FIRMWARE_SOURCE="$GITHUB_WORKSPACE/archlinux/firmware-tree" \
            ARCHLINUX_BUILD_DIR="$RUNNER_TEMP/surface-archlinux-build" \
            ARCHLINUX_OUTPUT_DIR="$GITHUB_WORKSPACE/build/archlinux" \
            KERNEL_CROSS_COMPILE= \
            ./archlinux/build-iso.sh

      - name: Verify ISO artifact
        run: |
          iso=$(find build/archlinux -maxdepth 1 -type f -name '*.iso' -print -quit)
          test -n "$iso"
          file "$iso"
          test -s build/archlinux/SHA256SUMS
          (cd build/archlinux && sha256sum -c SHA256SUMS)
          boot_files=$(xorriso -indev "$iso" -find /arch/boot/aarch64 -type f -exec lsdl --)
          printf '%s\n' "$boot_files"
          grep -Fq '/arch/boot/aarch64/vmlinuz-linux' <<<"$boot_files"
          grep -Fq '/arch/boot/aarch64/initramfs-linux.img' <<<"$boot_files"
          dtb_files=$(xorriso -indev "$iso" -find /boot/grub -type f -exec lsdl --)
          printf '%s\n' "$dtb_files"
          grep -Fq 'surface-laptop-13-archlinux-bluetooth.dtb' <<<"$dtb_files"
          ! grep -Fq 'surface-laptop-13-archlinux.dtb' <<<"$dtb_files"

      - name: Verify selected Bluetooth and battery DTB mode
        run: |
          iso=$(find build/archlinux -maxdepth 1 -type f -name '*.iso' -print -quit)
          test -n "$iso"
          dtb="$RUNNER_TEMP/surface-laptop-13-archlinux-bluetooth.dtb"
          xorriso -osirrox on -indev "$iso" \
            -extract /boot/grub/surface-laptop-13-archlinux-bluetooth.dtb "$dtb"
          expected=okay
          for node in /soc@0/remoteproc@6800000 /soc@0/remoteproc@32300000; do
            test "$(fdtget "$dtb" "$node" status)" = "$expected"
          done
          test "$(fdtget "$dtb" /soc@0/geniqup@ac0000/serial@a98000 status)" = okay
          test "$(fdtget "$dtb" /soc@0/geniqup@ac0000/serial@a98000/bluetooth compatible)" = qcom,wcn7850-bt

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: surface-laptop-13-archlinux-arm64
          if-no-files-found: error
          path: |
            build/archlinux/*.iso
            build/archlinux/SHA256SUMS
