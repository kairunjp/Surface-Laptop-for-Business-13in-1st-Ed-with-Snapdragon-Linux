insmod part_gpt
insmod part_msdos
insmod fat
insmod search
insmod search_fs_file
insmod linux
insmod fdt

search --no-floppy --file --set=root /boot/Image

set timeout=10
set default=0
set pager=1

menuentry "Surface Laptop 13 X1P42100 - BusyBox" {
    devicetree /boot/surface-laptop-13.dtb

    linux /boot/Image \
        console=tty0 \
        keep_bootcon \
        loglevel=7 \
        log_buf_len=8M \
        rdinit=/init \
        sbsa_gwdt.timeout=300 \
        panic=0

    initrd /boot/initramfs.cpio.gz
}

menuentry "Surface Laptop 13 X1P42100 - verbose diagnostics" {
    devicetree /boot/surface-laptop-13.dtb

    linux /boot/Image \
        console=tty0 \
        keep_bootcon \
        ignore_loglevel \
        loglevel=8 \
        log_buf_len=8M \
        printk.time=1 \
        initramfs_async=0 \
        efi=debug \
        rdinit=/init \
        gpu_diag_autorun=1 \
        sbsa_gwdt.timeout=300 \
        panic=0 \
        clk_ignore_unused \
        pd_ignore_unused \
        regulator_ignore_unused

    initrd /boot/initramfs.cpio.gz
}

menuentry "Surface Laptop 13 X1P42100 - Ubuntu ARM64 on USB" {
    devicetree /boot/surface-laptop-13.dtb

    linux /boot/Image \
        console=tty0 \
        keep_bootcon \
        loglevel=7 \
        log_buf_len=8M \
        rdinit=/init \
        root=LABEL=UBUNTU_ROOT \
        rootfstype=ext4 \
        rootwait \
        rw \
        sbsa_gwdt.timeout=300 \
        panic=0

    initrd /boot/initramfs.cpio.gz
}
